label: 'Glossary'
description: 'A scrolling strip of terms with scroll buttons and a counter over a wide cinema picture.'
weight: 4
stage: boxed
ground: light
placement: inner-padding
serves: [publication, university, associations]
options:
  tabs_position: top
  wrap_tabs: false
  max_width: 180
  max_height: 0
  available_breakpoints: '992'
  animation: a-top
  disable_background: true
  background_buttons: ''
  background_panes: ''
  enable_css: false
  enable_deeplink: false
features:
  - active_index
  - scroll_buttons
