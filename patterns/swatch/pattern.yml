label: 'Swatch'
description: 'Photo thumbnails as tabs in a rail on the right; the picture opens as a circle with a words card over it.'
weight: 2
stage: boxed
ground: light
placement: inner-padding
serves: [creative, studio, nonprofit]
options:
  tabs_position: right
  wrap_tabs: false
  max_width: 132
  max_height: 560
  available_breakpoints: '768'
  animation: a-right
  disable_background: true
  background_buttons: ''
  background_panes: ''
  enable_css: false
  enable_deeplink: false
features: []
pictures:
  vvj_image:
    style: vvj_thumb_240
    responsive: false
  vvj_image_1:
    style: vvj_landscape_1200
    responsive: false
needs:
  - 'First field: the image (vvj_image) with the image style vvj_thumb_240; its alt text names the tab. Rewrite it to print the tab label (vvj_nav_label) under the thumbnail.'
  - 'Then add the image again (Views names it vvj_image_1) with the image style vvj_landscape_1200, then kicker (vvj_kicker), title and summary (vvj_summary, trimmed to 180 characters).'
  - 'Give the field elements the classes vvj-kicker, vvj-title and vvj-summary.'
